<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몽글몽글 원정대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 휴대폰 세로 한 화면 — 위 도트 무대, 가운데 탭 내용, 아래 고정 탭바 */
:root{
  --bg:#eef3ff; --card:#ffffff; --ink:#26294a; --sub:#6b7096; --line:#d6ddf5;
  --accent:#ff6f9f; --accent-ink:#ffffff; --blue:#4f7cff; --gold:#d89a00; --good:#22a35a; --bad:#e0485a;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding-block:4px 8px;gap:8px}
header h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;letter-spacing:.5px}
.wallet{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-size:14px}
.wallet b{font-family:var(--display);font-weight:400;font-size:16px}
.coin{color:var(--gold)} .tix{color:var(--accent)}
#stageWrap{position:relative;border-radius:14px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
canvas.stage{display:block;width:100%;aspect-ratio:192/112;image-rendering:pixelated;max-width:100%;background:#9fd0ff}
#stageLabel{position:absolute;left:8px;top:6px;font-family:var(--display);font-size:14px;color:#fff;text-shadow:0 1px 0 #0008,1px 0 0 #0008,-1px 0 0 #0008,0 -1px 0 #0008}
#rate{position:absolute;right:8px;top:6px;font-size:12px;color:#fff;text-shadow:0 1px 0 #0009,1px 0 0 #0009,-1px 0 0 #0009;font-variant-numeric:tabular-nums}
main{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.card h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 6px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-block;font-size:12px;line-height:1;padding:4px 7px;border-radius:99px;color:#fff;font-family:var(--display);vertical-align:middle}
.btn{font-family:var(--display);font-size:17px;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 3px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#c9cde0;color:#6b7096;cursor:default;transform:none;box-shadow:0 3px 0 var(--ink)}
.btn.blue{background:var(--blue)} .btn.white{background:#fff;color:var(--ink)}
.btn.wide{width:100%}
.btn small{display:block;font-family:var(--body);font-size:12px;opacity:.9}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bossBox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.bossBox .thumb{background:#f4f6ff;border-radius:10px;padding:4px}
.adv{font-size:13px;line-height:1.6}
.adv .g{color:var(--good);font-weight:700} .adv .b{color:var(--bad);font-weight:700}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#f7f9ff;border:2px dashed var(--line);border-radius:12px;padding:6px;text-align:center;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;min-width:0}
.slot.on{border-style:solid;background:#fff}
.slot .nm{font-family:var(--display);font-size:14px}
.bar{height:6px;background:#e6e9f7;border-radius:99px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mon{position:relative;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 4px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.mon .nm{font-family:var(--display);font-size:14px}
.mon .lv{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.mon.r2{border-color:#9cc0ff} .mon.r3{border-color:#f0c040;background:linear-gradient(#fffaf0,#fff)}
.mon.inparty{border-color:var(--accent);box-shadow:0 0 0 2px #ffd0e0}
.mon.inparty::after{content:"출전";position:absolute;top:4px;right:4px;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:2px 5px;font-family:var(--display)}
.thumb{image-rendering:pixelated;display:block}
.gacha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.results{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.res{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;animation:pop .45s both;min-width:0}
.res.r2{border-color:#4a9aff;background:#f0f6ff} .res.r3{border-color:#f0b020;background:#fff7dc;box-shadow:0 0 0 3px #ffe08a}
.res .nm{font-family:var(--display);font-size:12px}
.res .tag{font-size:10px;color:var(--sub)}
.res .thumb{margin:0 auto}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dexi{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 2px;text-align:center;cursor:pointer;font:inherit;color:inherit;min-width:0}
.dexi .no{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.dexi .nm{font-size:11px}
.dexi .thumb{margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:12px 0 14px;font-family:var(--display);font-size:16px;color:var(--sub);cursor:pointer;position:relative}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::before{content:"";position:absolute;left:30%;right:30%;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
nav .dot{position:absolute;top:9px;right:24%;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ov{position:fixed;inset:0;background:#1e1a2ecc;z-index:10;display:flex;align-items:flex-end;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border:3px solid var(--ink);border-radius:18px;width:100%;max-width:460px;max-height:100%;overflow:auto;padding:14px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px}
#battleOv .sheet{display:flex;flex-direction:column;gap:10px}
#blog{background:#f4f6ff;border-radius:10px;padding:8px 10px;height:148px;overflow:auto;font-size:14px;line-height:1.55}
#blog p{margin:0 0 3px}
#blog .em{color:var(--bad)} #blog .win{color:var(--good);font-weight:700} #blog .lose{color:var(--bad);font-weight:700}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:20;width:max-content;max-width:90%;text-align:center}
.log{font-size:13px;line-height:1.7;color:var(--sub);margin:6px 0 0;padding-left:18px}
.info{font-size:13px;line-height:1.6;margin:8px 0 0;background:#f4f6ff;border-radius:10px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){.res{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>몽글몽글 원정대</h1>
    <div class="wallet"><span class="coin">● <b id="gold">0</b></span><span class="tix">◆ <b id="tix">0</b></span></div>
  </header>
  <div id="stageWrap"><canvas class="stage" id="stage" width="192" height="112"></canvas><div id="stageLabel"></div><div id="rate"></div></div>
  <main id="main"></main>
</div>
<nav><div class="in">
  <button data-tab="home" aria-current="page">모험</button>
  <button data-tab="team">편성</button>
  <button data-tab="gacha">뽑기<span class="dot" id="freeDot" hidden></span></button>
  <button data-tab="dex">도감</button>
</div></nav>

<div class="ov" id="startOv" hidden><div class="sheet">
  <h2>첫 동료를 골라주세요</h2>
  <p class="muted">셋 중 하나와 함께 원정을 떠납니다. 나머지 동료는 뽑기로 모을 수 있습니다.</p>
  <div class="starters" id="starters"></div>
</div></div>

<div class="ov" id="awayOv" hidden><div class="sheet">
  <h2>원정대가 돌아왔어요</h2>
  <p id="awayText" style="margin:0"></p>
  <ul class="log" id="awayLog"></ul>
  <button class="btn wide" id="awayOk" style="margin-top:12px">받기</button>
</div></div>

<div class="ov" id="battleOv" hidden><div class="sheet">
  <div class="row between"><h2 id="bTitle" style="margin:0"></h2></div>
  <canvas class="stage" id="bstage" width="192" height="112" style="border-radius:12px;border:3px solid var(--ink)"></canvas>
  <div id="blog" aria-live="polite"></div>
  <button class="btn white wide" id="bSkip">결과 바로 보기</button>
  <div id="bResult" hidden></div>
</div></div>

<script src="logic.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
